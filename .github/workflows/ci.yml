name: CI

on:
  push:
    branches-ignore:
    - dependabot/*
    - renovate/*
  pull_request:
    branches:
    - master
  workflow_dispatch:

# Cancel outdated runs on feature branches, never on master
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write              # lets GitHub issue the OIDC token for AWS
    env:
      # Push only on a direct push/merge to master.
      # TEMPORARY: cicd-container-setup is included so you can test the ECR push.
      # Remove "|| github.ref == 'refs/heads/cicd-container-setup'" before merging to master.
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cicd-container-setup') }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials (OIDC)
      if: env.PUSH_IMAGE == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Log in to Amazon ECR
      if: env.PUSH_IMAGE == 'true'
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Decide image tag
      id: tags
      run: |
        if [ "$PUSH_IMAGE" = "true" ]; then
          echo "tags=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        else
          echo "tags=manageiq-app:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build (and push when enabled)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: ${{ env.PUSH_IMAGE == 'true' }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false          # avoids extra "unknown" manifests in ECR

    - name: Summary
      env:
        IMAGE: ${{ steps.tags.outputs.tags }}
      run: |
        if [ "$PUSH_IMAGE" = "true" ]; then
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Built image (not pushed)" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "\`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"