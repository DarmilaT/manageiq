name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - dependabot/*
      - renovate/*
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

# Cancel old runs on feature branches when a new commit arrives,
# but never cancel a run on master (it may be halfway through pushing an image).
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: tests (unchanged from your original workflow)
  # ---------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version:
          - "3.3"
        test-suite:
          - vmdb
          - security
    services:
      postgres:
        image: manageiq/postgresql:16-el10
        env:
          POSTGRESQL_USER: root
          POSTGRESQL_PASSWORD: smartvm
          POSTGRESQL_DATABASE: vmdb_test
        options: "--health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5"
        ports:
          - 5432:5432
    env:
      TEST_SUITE: "${{ matrix.test-suite }}"
      PGHOST: localhost
      PGPASSWORD: smartvm
    steps:
      - uses: actions/checkout@v7
      - name: Set up system
        run: bin/before_install
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby-version }}"
          bundler-cache: true
        timeout-minutes: 30
      - name: Prepare tests
        run: bin/setup
      - name: Run database connectivity tests
        if: "${{ matrix.test-suite == 'vmdb' }}"
        run: bin/test_database_connectivity
      - name: Run tests
        run: bundle exec rake

  # ---------------------------------------------------------------
  # Job 2: Docker image
  #   - PRs / feature branches: build only (proves the Dockerfile works)
  #   - Push to master:         build AND push to Amazon ECR
  #   - Nightly schedule:       skipped (tests only)
  # ---------------------------------------------------------------
  docker:
    needs: ci # only runs if all test jobs passed
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # lets GitHub issue the OIDC token for AWS
    env:
      # true only for a direct push/merge to master
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH_IMAGE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.PUSH_IMAGE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decide image tag
        id: tags
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            echo "tags=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=manageiq-app:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # avoids extra "unknown" manifests showing up in ECR

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.tags }}
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Built image (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "\`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
