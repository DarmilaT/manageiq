name: Debug flaky MiqWorker spec # TEMPORARY - delete after investigating

on:
  push:
    branches:
      - cicd-container-setup

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: manageiq/postgresql:16-el10
        env:
          POSTGRESQL_USER: root
          POSTGRESQL_PASSWORD: smartvm
          POSTGRESQL_DATABASE: vmdb_test
        options: "--health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5"
        ports:
          - 5432:5432
    env:
      TEST_SUITE: vmdb
      PGHOST: localhost
      PGPASSWORD: smartvm
    steps:
      - uses: actions/checkout@v7
      - name: Set up system
        run: bin/before_install
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
        timeout-minutes: 30
      - name: Prepare tests
        run: bin/setup

      # Check 1: the failing file on its own. Expected: PASS
      - name: "Check 1 - miq_worker_spec alone"
        continue-on-error: true
        run: bundle exec rspec spec/models/miq_worker_spec.rb

      # Check 2: full suite in the exact same order as the failed run. Expected: FAIL
      - name: "Check 2 - full suite with seed 21197"
        continue-on-error: true
        env:
          SPEC_OPTS: "--seed 21197"
        run: bundle exec rake

      # Check 3: full suite in a different random order. Expected: PASS
      - name: "Check 3 - full suite with a new random seed"
        continue-on-error: true
        run: bundle exec rake
